<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Steven Punay — Portfolio</title>

  <!-- Google Fonts (Optimized to active fonts only) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BACK TO MAIN MENU -->
  <a href="#top" class="back-to-top nav-link" aria-label="Back to main menu">
    <img src="assets/Back.png" alt="">
  </a>

  <!-- HERO SECTION -->
  <section class="hero screen active" id="top">
    <div class="hero-slab" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-content">
        <img src="assets/MyPortfolio.png" alt="Take Your Portfolio." class="hero-title-img">
        <img src="assets/Calling.png" alt="Calling card" class="calling-card">
      </div>
      <ul class="command-stack">
        <li><a href="#about" class="nav-link"><img src="assets/About_Me.png" alt="About Me"></a></li>
        <li><a href="#designs" class="nav-link"><img src="assets/Designs.png" alt="Designs"></a></li>
        <li><a href="#work" class="nav-link"><img src="assets/Projects.png" alt="Projects"></a></li>
        <li><a href="#education" class="nav-link"><img src="assets/Education.png" alt="Education"></a></li>
        <li><a href="#contact" class="nav-link"><img src="assets/Contacts.png" alt="Contacts"></a></li>
      </ul>
    </div>
  </section>

  <!-- ABOUT SECTION -->
  <section id="about" class="screen">
    <div class="about-slab" aria-hidden="true"></div>
    <div class="about-scroll">
      <div class="section-header">
        <div class="title-wrap">
          <img src="assets/About_me.png" alt="About Me" class="section-title">
        </div>
      </div>
      <div class="confidant-stack">
        <img src="assets/Confidant.png" alt="Confidant" class="confidant-img">
      </div>
    </div>
  </section>

  <!-- DESIGNS SECTION -->
  <section id="designs" class="screen">
    <div class="designs-bg" aria-hidden="true">
      <svg class="bg-star" style="left:6%;top:8%;width:26vmax;height:26vmax" viewBox="0 0 100 100">
        <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#000"/>
      </svg>
      <svg class="bg-star s2" style="right:4%;bottom:6%;width:34vmax;height:34vmax" viewBox="0 0 100 100">
        <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#fff"/>
      </svg>
    </div>

    <div class="screen-scroll">
      <div class="section-header">
        <div class="title-wrap">
          <img src="assets/Designs.png" alt="Designs" class="section-title">
        </div>
      </div>

      <div class="phone-showcase" id="phone-showcase">
        <button class="phone-btn" id="phone-btn" type="button" aria-label="Answer the call to view designs">
          <img src="assets/Phone.png" alt="" class="phone-img">
        </button>

        <div class="line-panel" id="line-panel">
          <img src="assets/Line.png" alt="" class="line-img">

          <div class="metanav-grid" id="metanav-grid">
            <button class="metanav-btn" type="button" data-index="0" aria-label="Design 1"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="1" aria-label="Design 2"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="2" aria-label="Design 3"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="3" aria-label="Design 4"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="4" aria-label="Design 5"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="5" aria-label="Design 6"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="6" aria-label="Design 7"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="7" aria-label="Design 8"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
            <button class="metanav-btn" type="button" data-index="8" aria-label="Design 9"><img src="assets/Metanav.png" alt="" class="metanav-img"></button>
          </div>

          <div class="line-content" id="line-content"></div>
          <img src="assets/Esc.png" alt="Press Esc to go back" class="esc-hint" id="esc-hint" aria-hidden="true">
        </div>
      </div>
    </div>
  </section>

  <!-- PROJECTS SECTION -->
  <section id="work" class="screen">
    <div class="work-bg" aria-hidden="true">
      <svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="work-star-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
            <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#3a3a3a" opacity="0.6" transform="translate(10,10) scale(0.9)"></polygon>
            <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#5a5a5a" opacity="0.35" transform="translate(115,55) scale(0.55) rotate(25 50 50)"></polygon>
            <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#151515" opacity="0.5" transform="translate(55,130) scale(0.7) rotate(-18 50 50)"></polygon>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#work-star-pattern)"></rect>
      </svg>
    </div>

    <div class="screen-scroll">
      <div class="section-header">
        <div class="title-wrap">
          <img src="assets/Projects.png" alt="Projects" class="section-title">
        </div>
      </div>

      <div class="project-grid">
        <div class="project-card"><img src="assets/file1.png" alt="Project 1" class="project-img"></div>
        <div class="project-card"><img src="assets/file2.png" alt="Project 2" class="project-img"></div>
        <div class="project-card"><img src="assets/file3.png" alt="Project 3" class="project-img"></div>
      </div>
    </div>
  </section>

  <!-- EDUCATION / CV SECTION -->
  <section id="education" class="screen">
    <div class="education-bg" aria-hidden="true">
      <div class="education-bg-red">
        <svg class="edu-tiles" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="education-star-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
              <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#e60012" opacity="0.55" transform="translate(10,10) scale(0.9)"></polygon>
              <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#ff4d5a" opacity="0.3" transform="translate(115,55) scale(0.55) rotate(25 50 50)"></polygon>
              <polygon points="50,0 60,35 98,35 68,57 78,94 50,72 22,94 32,57 2,35 40,35" fill="#8a0009" opacity="0.5" transform="translate(55,130) scale(0.7) rotate(-18 50 50)"></polygon>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#education-star-pattern)"></rect>
        </svg>
      </div>
      <div class="education-bg-grey"></div>
    </div>

    <div class="screen-scroll">
      <div class="section-header">
        <div class="title-wrap">
          <img src="assets/Education.png" alt="About" class="section-title">
        </div>
      </div>

      <img src="assets/JackFrost.png" alt="" class="education-side-art" aria-hidden="true" onerror="this.remove()">
      <div class="cv-viewer">
        <img src="assets/CV.png" alt="Steven Punay's CV" class="cv-image">
      </div>
      <a class="cv-btn" href="assets/Files/Steven_Punay_CV.pdf" download="Steven_Punay_CV.pdf" aria-label="Download my CV (PDF)">
        <img src="assets/PDF.png" alt="" class="cv-btn-img">
      </a>
    </div>
  </section>

 <!-- CONTACT SECTION -->
  <section id="contact" class="screen">
    <div class="contact-slab" aria-hidden="true"></div>

    <div class="screen-scroll">
      <div class="section-header">
        <div class="title-wrap">
          <img src="assets/Contacts.png" alt="Contacts" class="section-title">
        </div>
      </div>

      <div class="calling-card-showcase" id="calling-card-showcase">
        <button class="calling-card-btn" id="calling-card-btn" type="button" aria-label="Open the contact form">
          <img src="assets/CallingCard1.png" alt="" class="calling-card-img">
        </button>

        <div class="contact-reveal" id="contact-reveal">
          <div class="contact-list">
            <a class="contact-chip" href="mailto:punay.stevenkenn.bscs2025@gmail.com" aria-label="Email">
              <img src="assets/Email.png" alt="" class="contact-chip-img">
            </a>
            <a class="contact-chip" href="https://www.facebook.com/stevn.not/" target="_blank" rel="noopener" aria-label="Facebook">
              <img src="assets/Facebook.png" alt="" class="contact-chip-img">
            </a>
            <a class="contact-chip" href="https://www.instagram.com/stvn_not/?hl=en" target="_blank" rel="noopener" aria-label="Instagram">
              <img src="assets/Insta.png" alt="" class="contact-chip-img">
            </a>
            <a class="contact-chip" href="https://github.com/Greends4052" target="_blank" rel="noopener" aria-label="GitHub">
              <img src="assets/Git.png" alt="" class="contact-chip-img">
            </a>
            <a class="contact-chip" href="assets/Files/Steven_Punay_CV.pdf" download="Steven_Punay_CV.pdf" aria-label="Download CV">
              <img src="assets/CVpic.png" alt="" class="contact-chip-img">
            </a>
          </div>

          <form id="contact-form" class="contact-form" novalidate>
            <img src="assets/Send.png" alt="Send me a message" class="form-head-img">
            <label class="field">
              <img src="assets/Name.png" alt="Name" class="field-label-img">
              <input type="text" name="name" required maxlength="100" autocomplete="name">
            </label>
            <label class="field">
              <img src="assets/SendEmail.png" alt="Your email" class="field-label-img">
              <input type="email" name="email" required maxlength="150" autocomplete="email">
            </label>
            <label class="field">
              <img src="assets/Message.png" alt="Message" class="field-label-img">
              <textarea name="message" required rows="5" maxlength="3000"></textarea>
            </label>
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-5000px" aria-hidden="true">
            <div class="form-foot">
              <button type="submit" class="form-send" aria-label="Send it">
                <img src="assets/Sent.png" alt="" class="form-send-img">
              </button>
              <div id="form-status" role="status"></div>
            </div>
          </form>
        </div>
      </div>

      <img src="assets/Jack.png" alt="" class="contact-side-art" aria-hidden="true" onerror="this.remove()">

      <footer>
        <span>&copy; 2026 Steven Punay. All rights reserved.</span>
        <span>Built with intent, not templates.</span>
      </footer>
    </div>
  </section>

  <!-- SCREEN WIPE TRANSITION -->
  <div id="wipe" aria-hidden="true">
    <div class="pane p3"></div>
    <div class="pane p2"></div>
    <div class="pane p1"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
